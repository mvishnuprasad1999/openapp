name: open_ui
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  google_fonts: ^8.0.2
  flutter_riverpod: ^3.3.1
  http: ^1.6.0
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/filelogo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/filelogo.png"
flutter:
  uses-material-design: true
  
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/   # ✅ Fixed: Proper indentation and correct path